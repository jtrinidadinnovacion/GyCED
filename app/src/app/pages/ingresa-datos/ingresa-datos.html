<div class="pantalla fondo-gyced">
  <header class="cabecera">
    <img class="logo" src="img/icono.png" alt="" />
    <div class="titulos">
      <h1>GyCED</h1>
      <p>Ingresa tus datos</p>
    </div>

    <app-ventana-controles class="controles" />
  </header>

  <div class="pasos">
    <span class="pasos__linea"></span>

    <div class="paso paso--ingresa paso--activo">
      <span class="paso__numero">1</span>
      <span class="paso__texto">Ingresa datos</span>
    </div>
    <div class="paso paso--preguntas">
      <span class="paso__numero">2</span>
      <span class="paso__texto">Preguntas</span>
    </div>
    <div class="paso paso--generar">
      <span class="paso__numero">3</span>
      <span class="paso__texto">Generar examen</span>
    </div>
  </div>

  <div class="contenido">
    <form class="formulario">
      <label for="plantel">Nombre del plantel:</label>
      <input
        id="plantel"
        type="text"
        placeholder="Ingresa la escuela"
        [(ngModel)]="datos.plantel"
        (ngModelChange)="sanitizarPlantel()"
        (keydown)="bloquearTecla($event, true)"
        maxlength="100"
        required
        name="plantel"
      />

      <label for="docente">Nombre del docente:</label>
      <input
        id="docente"
        type="text"
        placeholder="Nombre(s) y apellidos"
        [(ngModel)]="datos.docente"
        (ngModelChange)="sanitizarDocente()"
        (keydown)="bloquearTecla($event, false)"
        maxlength="100"
        required
        name="docente"
      />

      <div class="fila">
        <div class="campo">
          <label for="fecha">Fecha:</label>
          <input id="fecha" type="date" [(ngModel)]="datos.fecha" required name="fecha" />
        </div>
        <div class="campo">
          <label for="grupo">Grupo:</label>
          <input
            id="grupo"
            type="text"
            placeholder="Grado y grupo"
            [(ngModel)]="datos.grupo"
            maxlength="30"
            required
            name="grupo"
          />
        </div>
      </div>

      <button class="boton-generar" type="button" (click)="continuar()">Continuar</button>
    </form>

    <img class="ilustracion" src="img/img_datos.png" alt="" />
  </div>
</div>
