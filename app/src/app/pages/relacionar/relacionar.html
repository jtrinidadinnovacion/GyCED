<div class="pantalla fondo-gyced">
  <header class="cabecera">
    <img class="logo" src="img/icono.png" alt="" />
    <div class="titulos">
      <h1>GyCED</h1>
      <p>Preguntas</p>
    </div>

    <app-ventana-controles class="controles" />
  </header>

  <div class="pasos">
    <span class="pasos__linea"></span>

    <div class="paso paso--ingresa">
      <span class="paso__numero">1</span>
      <span class="paso__texto">Ingresa datos</span>
    </div>
    <div class="paso paso--preguntas paso--activo">
      <span class="paso__numero">2</span>
      <span class="paso__texto">Preguntas</span>
    </div>
    <div class="paso paso--generar">
      <span class="paso__numero">3</span>
      <span class="paso__texto">Generar examen</span>
    </div>
  </div>

  <div class="tarjeta">
    <div class="tarjeta__formulario">
      <div class="fila-titulo">
        <div class="campo campo--titulo">
          <label>Título del examen</label>
          <input class="input-gyced" type="text" placeholder="Escribe aquí..." [(ngModel)]="tituloExamen" name="tituloExamen" />
        </div>

        <div class="tipo-badge">
          <span>Relacionar</span>
          <span class="tipo-badge__flecha"></span>
        </div>
      </div>

      <div class="campo">
        <label>Instrucciones</label>
        <input class="input-gyced" type="text" placeholder="Escribe aquí..." [(ngModel)]="instrucciones" name="instrucciones" />
      </div>

      <hr class="separador" />

      <div class="preguntas-seccion">
        <label>Preguntas</label>

        <div class="pregunta-fila" *ngFor="let par of pares; let i = index">
          <span class="pregunta-fila__numero">{{ i + 1 }}.</span>

          <input
            *ngIf="preguntaEsTexto"
            class="input-gyced"
            type="text"
            placeholder="Escribe aquí..."
            [(ngModel)]="par.pregunta.texto"
            [name]="'pregunta' + i"
          />

          <label class="archivo" *ngIf="!preguntaEsTexto" [class.archivo--con-imagen]="par.pregunta.archivoUrl">
            <input type="file" accept="image/png,image/jpeg" (change)="onArchivo($event, par.pregunta)" hidden />
            <img *ngIf="par.pregunta.archivoUrl" class="archivo__preview" [src]="par.pregunta.archivoUrl" alt="" />
            <span class="archivo__pill">
              <img src="img/cargar_img.png" alt="" />
              {{ par.pregunta.archivoNombre || 'Seleccionar archivo' }}
              <button
                *ngIf="par.pregunta.archivoNombre"
                class="archivo__quitar"
                type="button"
                (click)="quitarImagen(par.pregunta, $event)"
              >✕</button>
            </span>
          </label>

          <button class="quitar" type="button" (click)="quitarPar(i)" aria-label="Eliminar pregunta">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5" />
              <line x1="4.5" y1="8" x2="11.5" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
        </div>

        <button class="btn-agregar" type="button" (click)="agregarPar()">+ Agregar pregunta</button>
      </div>
    </div>

    <div class="tarjeta__respuestas">
      <label>Respuestas</label>

      <div class="respuesta-fila" *ngFor="let par of pares; let i = index">
        <input
          *ngIf="respuestaEsTexto"
          class="input-gyced"
          type="text"
          placeholder="Escribe aquí..."
          [(ngModel)]="par.respuesta.texto"
          [name]="'respuesta' + i"
        />

        <label class="archivo" *ngIf="!respuestaEsTexto" [class.archivo--con-imagen]="par.respuesta.archivoUrl">
          <input type="file" accept="image/png,image/jpeg" (change)="onArchivo($event, par.respuesta)" hidden />
          <img *ngIf="par.respuesta.archivoUrl" class="archivo__preview" [src]="par.respuesta.archivoUrl" alt="" />
          <span class="archivo__pill">
            <img src="img/cargar_img.png" alt="" />
            {{ par.respuesta.archivoNombre || 'Seleccionar archivo' }}
            <button
              *ngIf="par.respuesta.archivoNombre"
              class="archivo__quitar"
              type="button"
              (click)="quitarImagen(par.respuesta, $event)"
            >✕</button>
          </span>
        </label>
      </div>

      <p class="ayuda">Las respuestas saldrán en orden aleatorio en el examen final.</p>
    </div>
  </div>

  <button class="boton-generar" type="button" (click)="generarExamen()">Generar examen</button>
</div>
