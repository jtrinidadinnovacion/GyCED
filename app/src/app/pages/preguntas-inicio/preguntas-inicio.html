<div class="pantalla fondo-gyced">
  <header class="cabecera">
    <img class="logo" src="img/icono.png" alt="" />
    <div class="titulos">
      <h1>GyCED</h1>
      <p>Preguntas</p>
    </div>

    <app-ventana-controles class="controles" />
  </header>

  <div class="pasos">
    <span class="pasos__linea"></span>

    <div class="paso paso--ingresa">
      <span class="paso__numero">1</span>
      <span class="paso__texto">Ingresa datos</span>
    </div>
    <div class="paso paso--preguntas paso--activo">
      <span class="paso__numero">2</span>
      <span class="paso__texto">Preguntas</span>
    </div>
    <div class="paso paso--generar">
      <span class="paso__numero">3</span>
      <span class="paso__texto">Generar examen</span>
    </div>
  </div>

  <div class="tarjeta">
    <div class="tarjeta__formulario">
      <div class="fila-titulo">
        <div class="campo campo--titulo">
          <label>Título del examen</label>
          <input class="input-gyced" type="text" placeholder="Escribe aquí..." [(ngModel)]="tituloExamen" name="tituloExamen" />
        </div>

        <div class="select-tipo">
          <button type="button" class="select-tipo__trigger" (click)="toggleDropdown()">
            <span>{{ tipoSeleccionado || 'Elige una opción' }}</span>
            <span class="select-tipo__flecha"></span>
          </button>

          <ul class="select-tipo__lista" *ngIf="dropdownAbierto">
            <li *ngFor="let tipo of tiposEvaluacion" (click)="seleccionarTipo(tipo)">{{ tipo }}</li>
          </ul>
        </div>
      </div>

      <div class="campo">
        <label>Instrucciones</label>
        <input class="input-gyced" type="text" placeholder="Escribe aquí..." [(ngModel)]="instrucciones" name="instrucciones" />
      </div>

      <hr class="separador" />

      <div class="preguntas-seccion">
        <label>Preguntas</label>
        <p class="preguntas-vacio">Elige un tipo de evaluación para empezar a capturar preguntas.</p>
      </div>
    </div>

    <img class="ilustracion" src="img/img_libro.png" alt="" />
  </div>

  <div class="modal-relacion" *ngIf="mostrarModalRelacion">
    <button class="modal-relacion__cerrar" type="button" (click)="mostrarModalRelacion = false">✕</button>

    <div class="tarjetas">
      <div class="tarjeta-relacion" *ngFor="let tipo of tiposRelacion">
        <img class="tarjeta-relacion__icono" [src]="'img/' + tipo.icono + '.png'" alt="" />
        <p class="tarjeta-relacion__titulo">{{ tipo.titulo }}</p>
        <button class="tarjeta-relacion__boton" type="button" (click)="elegirRelacion(tipo)">Realizar Evaluación</button>
      </div>
    </div>
  </div>
</div>
